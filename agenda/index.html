<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#002749">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<title>Agenda Integral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: una columna estilo iOS, encabezado azul fijo, barra de pestañas inferior y hojas deslizables. */
:root{
  --navy:#002749; --orange:#F47920; --orange-soft:#FDEBDD;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#E1E6ED;
  --fg:#0E1C2F; --muted:#66748A; --on-navy:#FFFFFF; --on-navy-muted:#A9B8CC;
  --header:#002749; --tab:#FFFFFFF2; --seg-on:#FFFFFF;
  --c-personal:#6B7A8F; --c-inbursa:#002749; --c-tlg:#F47920;
  --ok:#2E9B68; --warn:#D99A00; --crit:#D2453F;
  --ok-soft:#E3F3EB; --crit-soft:#FBE7E6;
  --shadow:0 1px 2px rgba(0,39,73,.06),0 4px 16px rgba(0,39,73,.06);
  --f-display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --orange-soft:#3A2414; --bg:#08121E; --surface:#101C2B; --surface-2:#172638; --line:#22344A;
  --fg:#E8EDF4; --muted:#8E9CB0; --header:#001A31; --tab:#0C1724F2; --seg-on:#2B4260;
  --c-personal:#9AA8BB; --c-inbursa:#5C8BC4;
  --ok-soft:#12301F; --crit-soft:#3A1715; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --orange-soft:#3A2414; --bg:#08121E; --surface:#101C2B; --surface-2:#172638; --line:#22344A;
  --fg:#E8EDF4; --muted:#8E9CB0; --header:#001A31; --tab:#0C1724F2; --seg-on:#2B4260;
  --c-personal:#9AA8BB; --c-inbursa:#5C8BC4;
  --ok-soft:#12301F; --crit-soft:#3A1715; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--header)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Encabezado */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);color:var(--on-navy)}
header.top .wrap{padding-block:14px 16px;display:flex;align-items:flex-end;gap:12px}
.top h1{font:600 22px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .date{color:var(--on-navy-muted);font-size:13px;margin-bottom:2px}
.top .grow{flex:1;min-width:0}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:var(--on-navy)}
.iconbtn svg{width:20px;height:20px}
.brandbar{height:3px;background:var(--orange)}

main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
section.block{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sec-h h2{font:600 13px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.sec-h .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--orange);font-weight:600;font-size:14px;padding:4px}

/* Tarjetas de resumen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left}
.stat b{display:block;font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.crit b{color:var(--crit)}
.stat.acc b{color:var(--orange)}

/* Segmentos y chips */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* Lista de actividades */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0;color:#fff}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk svg{opacity:1}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.chk.p-alta{border-color:var(--crit)} .chk.p-media{border-color:var(--orange)}
.tbody{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.ttitle{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.tmeta svg{width:13px;height:13px;vertical-align:-2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.due.over{color:var(--crit);font-weight:600}
.due.today{color:var(--orange);font-weight:600}
.av{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;background:var(--c-personal);letter-spacing:.02em}
.av.lg{width:42px;height:42px;font-size:15px}
.av.a-inbursa{background:#002749} .av.a-tlg{background:var(--orange)} .av.a-personal{background:#6B7A8F} .av.me{background:var(--fg);color:var(--bg)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.more{display:block;width:100%;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:10px}

.banner{display:flex;gap:10px;align-items:center;background:var(--orange-soft);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;font-size:13.5px}
.banner p{margin:0;flex:1;min-width:0}
.banner button{flex:none;border:0;border-radius:10px;padding:7px 10px;background:var(--orange);color:#fff;font-weight:600;font-size:13px}

/* Carga de trabajo */
.people{display:grid;gap:10px}
.person{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.person .info{flex:1;min-width:0}
.person .name{font-weight:600}
.person .role{font-size:12.5px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.loadline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--orange-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.teamsum{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 2px 12px}
.teamsum b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Activos */
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.asset{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.asset svg{width:22px;height:22px;color:var(--navy)}
:root[data-theme="dark"] .asset svg{color:var(--c-inbursa)}
.asset b{font-weight:600;overflow-wrap:anywhere}
.asset small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.asset.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);box-shadow:none;font-weight:600;font-size:13px}

/* Agenda */
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.day b{font:600 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day i.on{background:var(--orange)}
.day.today b{color:var(--orange)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.day[aria-pressed="true"] small{color:var(--on-navy-muted)}
.day[aria-pressed="true"] b{color:#fff}

/* Barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tab);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--orange)}
.fab{justify-self:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--orange);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(244,121,32,.35);margin-top:-18px}
.fab svg{width:26px;height:26px}

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,20,40,.45)}
.panel{position:relative;width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.panel h3{font:600 19px/1.2 var(--f-display);margin:0 0 14px;text-wrap:balance}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.phead h3{margin:0}
.form{display:grid;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--orange);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.small{flex:none;padding:9px 12px;font-size:13.5px}
.note{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h4{margin:0 0 6px;font-size:15px}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.stack{display:grid;gap:12px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.channels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chan{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:13.5px;box-shadow:var(--shadow)}
.chan svg{width:24px;height:24px}
.chan.mail svg{color:var(--orange)} .chan.sms svg{color:var(--c-inbursa)} .chan.wa svg{color:var(--ok)}
.msg{min-height:240px;font-size:15px;line-height:1.45}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sheet:not([hidden]) ~ .toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.loading{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--muted);font-weight:600}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<header class="top">
  <div class="wrap">
    <div class="grow">
      <div class="date" id="hdate"></div>
      <h1 id="htitle">Hoy</h1>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="brandbar"></div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button class="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button class="tab" data-tab="areas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Áreas</button>
    <button class="fab" data-act="newtask" aria-label="Nueva actividad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3A6.5 6.5 0 0 1 21.5 20"/></svg>Equipo</button>
    <button class="tab" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true" id="panel"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="loading" id="loading" role="status"><div class="spin" aria-hidden="true"></div>Cargando tus datos…</div>
<input type="file" id="importFile" accept="application/json,.json" class="vh" aria-label="Importar respaldo">

<script>
(function(){
"use strict";
/* ---------- Configuración ---------- */
const KEY = "agendaIntegral.v1";
const AREAS = {
  personal: {name:"Personal", sub:"Familia, vehículos y casas", cats:["Familia","Vehículos","Casas","Salud","Finanzas","Trámites","Otro"]},
  inbursa:  {name:"Inbursa", sub:"Relaciones Institucionales", cats:["Clientes institucionales","Prospección","Reuniones","Reportes","Seguimiento de equipo","Otro"]},
  tlg:      {name:"TL Guerrero", sub:"Consultores · PLD para OSFL", cats:["PLD / Avisos","Expedientes KYC","Contabilidad","Jurídico","Clientes","Capacitación","Administración","Otro"]}
};
const AREA_KEYS = ["personal","inbursa","tlg"];
const PRIO = {alta:{w:3,l:"Alta"}, media:{w:2,l:"Media"}, baja:{w:1,l:"Baja"}};
const REPEAT = {none:"No se repite", daily:"Cada día", weekdays:"Lunes a viernes", weekly:"Cada semana", biweekly:"Cada 2 semanas", monthly:"Cada mes", bimonthly:"Cada 2 meses", yearly:"Cada año"};

/* ---------- Utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYMD(s); d.setDate(d.getDate()+n); return ymd(d); };
function addMonths(s, n){ const d = parseYMD(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return ymd(d); }
const daysBetween = (a, b) => Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const fmtShort = s => { const d = parseYMD(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };

function dueTs(t){ const d = parseYMD(t.due); if (t.time){ const [h,m] = t.time.split(":"); d.setHours(+h, +m); } else d.setHours(23,59); return d.getTime(); }
function remindTs(t){ const d = parseYMD(t.due); if (t.time){ const [h,m] = t.time.split(":"); d.setHours(+h, +m); } else d.setHours(9,0); return d.getTime() - (+t.remind)*60000; }
function isOverdue(t){ if (t.done || !t.due) return false; return t.time ? dueTs(t) < Date.now() : t.due < today(); }
function relDue(t){
  if (!t.due) return {txt:"Sin fecha", cls:""};
  const diff = daysBetween(today(), t.due), tm = t.time ? " · " + t.time : "";
  if (!t.done && isOverdue(t)) return {txt: diff === 0 ? "Vencida" + tm : diff === -1 ? "Venció ayer" : `Vencida hace ${-diff} d`, cls:"over"};
  if (diff === 0) return {txt:"Hoy" + tm, cls:"today"};
  if (diff === 1) return {txt:"Mañana" + tm, cls:""};
  if (diff > 1 && diff < 7) return {txt: DAYS[parseYMD(t.due).getDay()] + tm, cls:""};
  return {txt: fmtShort(t.due) + tm, cls:""};
}
function nextDue(t){
  const s = t.due;
  switch (t.repeat){
    case "daily": return addDays(s,1);
    case "weekdays": { let n = addDays(s,1); while ([0,6].includes(parseYMD(n).getDay())) n = addDays(n,1); return n; }
    case "weekly": return addDays(s,7);
    case "biweekly": return addDays(s,14);
    case "monthly": return addMonths(s,1);
    case "bimonthly": return addMonths(s,2);
    case "yearly": return addMonths(s,12);
  }
  return null;
}
function sortTasks(a, b){
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (!a.due !== !b.due) return a.due ? -1 : 1;
  if (a.due && b.due){ const d = dueTs(a) - dueTs(b); if (d) return d; }
  return PRIO[b.prio].w - PRIO[a.prio].w;
}

/* ---------- Guardado: dispositivo (localStorage + IndexedDB) y cuenta de Claude ---------- */
let S;
const IN_ARTIFACT = !document.querySelector('link[rel="manifest"]');
let syncState = IN_ARTIFACT ? "connecting" : "local", cloudRef = null, cloudTimer = null;
const validState = d => d && typeof d === "object" && Array.isArray(d.tasks) ? d : null;
function normalize(){
  S.people = S.people || []; S.assets = S.assets || []; S.tasks = S.tasks || [];
  S.ui = Object.assign({tab:"hoy", hoyArea:"all", area:"personal", cat:"", team:"inbursa", day:today()}, S.ui||{});
  S.profile = Object.assign({name:"", inbursaTitle:"Gerente de Relaciones Institucionales", tlgTitle:"Director General"}, S.profile||{});
}
function readLocal(){ try { return validState(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return null; } }
let idbP;
function idb(){
  return idbP = idbP || new Promise((res, rej) => {
    try { const r = indexedDB.open("agenda-integral", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
async function idbPut(txt){ try { (await idb()).transaction("kv", "readwrite").objectStore("kv").put(txt, "state"); } catch(e){} }
async function idbGet(){
  try {
    const db = await idb();
    return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get("state"); q.onsuccess = () => { try { res(validState(JSON.parse(q.result))); } catch(e){ res(null); } }; q.onerror = () => res(null); });
  } catch(e){ return null; }
}
function writeLocal(){ const txt = JSON.stringify(S); try { localStorage.setItem(KEY, txt); } catch(e){} idbPut(txt); }
async function cloudLoad(){
  if (!IN_ARTIFACT) return null;
  for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)){ syncState = "off"; return null; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = db && user ? await user.id() : null;
    if (!id){ syncState = "off"; return null; }
    const ref = db.doc("data/users/" + id + "/agenda");
    const snap = await ref.get();
    cloudRef = ref; syncState = "on";
    return snap.exists ? validState(JSON.parse(snap.data().json)) : null;
  } catch(e){ syncState = "off"; cloudRef = null; return null; }
}
function queueCloud(){ if (!cloudRef) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1200); }
async function pushCloud(retried){
  clearTimeout(cloudTimer); cloudTimer = null;
  if (!cloudRef) return;
  try { await cloudRef.set({json: JSON.stringify(S), at: S.savedAt || Date.now()}); syncState = "on"; }
  catch(e){
    const code = e && e.code;
    if (code === "unavailable" && !retried) { setTimeout(() => pushCloud(true), 1500 + Math.random()*2000); return; }
    syncState = code === "quota_exceeded" ? "full" : "error";
    toast(syncState === "full" ? "Tu espacio de guardado está lleno. Exporta un respaldo y borra actividades antiguas." : "No se pudo guardar en tu cuenta. Se reintentará con el siguiente cambio.", 5000);
  }
}
function save(){ S.savedAt = Date.now(); writeLocal(); queueCloud(); }

const person = id => S.people.find(p => p.id === id);
const whoName = id => id === "me" ? "Yo" : (person(id)?.name || "Sin asignar");
function avatar(id, lg){
  if (id === "me") return `<span class="av me${lg?" lg":""}" aria-hidden="true">YO</span>`;
  const p = person(id); if (!p) return "";
  return `<span class="av a-${p.area}${lg?" lg":""}" aria-hidden="true">${esc(initials(p.name))}</span>`;
}
function workload(id, area){
  const open = S.tasks.filter(t => !t.done && t.who === id && (!area || t.area === area));
  const horizon = addDays(today(), 14);
  let pts = 0, over = 0;
  open.forEach(t => { const w = PRIO[t.prio].w; const o = isOverdue(t); if (o) over++; if (!t.due || t.due <= horizon) pts += o ? w + 1 : w; });
  const cap = id === "me" ? 20 : (person(id)?.capacity || 12);
  const pct = Math.round(pts / cap * 100);
  const lvl = pct > 100 ? ["crit","Saturado"] : pct >= 70 ? ["warn","Ocupado"] : ["ok","Disponible"];
  return {open:open.length, over, pts, cap, pct, cls:lvl[0], label:lvl[1]};
}

function renderAgenda(){
  $("#htitle").textContent = "Agenda";
  const t0 = today(), start = addDays(t0, -((parseYMD(t0).getDay()+6)%7));
  const sel = S.ui.day || t0;
  const busy = new Set(S.tasks.filter(t => !t.done && t.due).map(t => t.due));
  let strip = "";
  for (let i = 0; i < 35; i++){
    const d = addDays(start, i), dd = parseYMD(d);
    strip += `<button class="day${d===t0?" today":""}" data-act="day" data-v="${d}" aria-pressed="${d===sel}"><small>${DAYS[dd.getDay()]}</small><b>${dd.getDate()}</b><i class="${busy.has(d)?"on":""}"></i></button>`;
  }
  const list = S.tasks.filter(t => t.due === sel).sort(sortTasks);
  const nodate = S.tasks.filter(t => !t.done && !t.due).sort(sortTasks);
  const dd = parseYMD(sel);
  const long = dd.toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long"});
  view.innerHTML = `
    <div class="days" id="days">${strip}</div>
    <section class="block"><div class="sec-h"><h2>${esc(long)}</h2><button class="linkbtn" data-act="newtask" data-v="${sel}">+ Agregar</button></div>${taskList(list, "Día libre. Nada programado.")}</section>
    ${nodate.length ? `<section class="block"><div class="sec-h"><h2>Sin fecha</h2><span class="count">${nodate.length}</span></div>${taskList(nodate)}</section>` : ""}
  `;
  const el = $(`.day[aria-pressed="true"]`); if (el) el.scrollIntoView({inline:"center", block:"nearest"});
}

function render(){
  const d = new Date();
  const ds = d.toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  $("#hdate").textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.tab === S.ui.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  ({hoy:renderHoy, areas:renderAreas, equipo:renderEquipo, agenda:renderAgenda})[S.ui.tab]();
}

const longDate = s => parseYMD(s).toLocaleDateString("es-MX", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const fmtStamp = ts => { const d = new Date(ts); return `${fmtShort(ymd(d))}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (/macintosh/i.test(navigator.userAgent) && "ontouchend" in document);
function intlPhone(raw){
  let d = String(raw||"").replace(/\D/g,"");
  if (!d) return "";
  if (d.length === 10) d = "52" + d;           // celular mexicano sin lada internacional
  return d;
}
function signature(area){
  const pr = S.profile, n = pr.name.trim();
  if (area === "inbursa") return [n, pr.inbursaTitle, "Banco Inbursa"].filter(Boolean).join("\n");
  if (area === "tlg") return [n, pr.tlgTitle, "TL Guerrero Consultores"].filter(Boolean).join("\n");
  return n;
}
function whenText(t){ return t.due ? longDate(t.due) + (t.time ? `, ${t.time} h` : "") : "Por definir"; }
function buildMessage(tasks, p){
  const one = tasks.length === 1, area = p.area;
  if (area === "personal"){
    const first = p.name.trim().split(/\s+/)[0];
    const items = tasks.map(t => `• ${t.title}\n   ${whenText(t)}${t.notes ? "\n   " + t.notes : ""}`).join("\n\n");
    return `Hola, ${first}:\n\nTe comparto ${one ? "este pendiente" : "estos pendientes"} para tenerlo${one ? "" : "s"} presente${one ? "" : "s"}:\n\n${items}\n\nGracias por tu apoyo.${S.profile.name ? "\n\n" + S.profile.name.trim() : ""}`;
  }
  let body;
  if (one){
    const t = tasks[0];
    const L = [`• Actividad: ${t.title}`, `• Rubro: ${t.cat}`, `• Fecha compromiso: ${whenText(t)}`, `• Prioridad: ${PRIO[t.prio].l}`];
    if (t.repeat !== "none") L.push(`• Periodicidad: ${REPEAT[t.repeat]}`);
    if (t.notes) L.push(`• Indicaciones: ${t.notes}`);
    body = `Por este medio le informo que se le ha asignado la siguiente actividad:\n\n${L.join("\n")}\n\nLe agradeceré confirmar de recibido y mantenerme informado sobre su avance. Quedo a su disposición para cualquier duda o comentario.`;
  } else {
    const items = tasks.map((t,i) => `${i+1}. ${t.title}\n   Fecha compromiso: ${whenText(t)} · Prioridad: ${PRIO[t.prio].l}${isOverdue(t) ? " · VENCIDA" : ""}${t.notes ? "\n   Indicaciones: " + t.notes : ""}`).join("\n\n");
    body = `Por este medio le comparto el resumen de las ${tasks.length} actividades que tiene asignadas y pendientes:\n\n${items}\n\nLe agradeceré revisar las fechas compromiso, confirmar de recibido e informarme oportunamente sobre cualquier situación que pudiera afectar su cumplimiento.`;
  }
  return `${p.salute || "Estimado(a)"} ${p.name.trim()}:\n\n${body}\n\nSaludos cordiales,\n\n${signature(area)}`.trim();
}

  const missing = [!p.email && "correo", !p.phone && "celular"].filter(Boolean);
  openSheet(`
    <div class="phead"><div style="display:flex;gap:12px;align-items:center;min-width:0">${avatar(pid,true)}<div style="min-width:0"><h3>${fresh ? "¿Le avisas a " + esc(p.name.split(/\s+/)[0]) + "?" : "Notificar a " + esc(p.name)}</h3><div class="note">${esc([p.email, p.phone].filter(Boolean).join(" · ") || "Sin datos de contacto")}</div></div></div></div>
    <div class="form">
      <p class="note">Revisa y ajusta el mensaje. No se envía nada automáticamente: al elegir un medio se abre la app correspondiente con el texto listo y tú decides si lo envías.</p>
      <label class="field"><span>Asunto (solo correo)</span><input id="n-subject" maxlength="160" value="${esc(subject)}"></label>
      <label class="field"><span>Mensaje</span><textarea id="n-msg" class="msg">${esc(buildMessage(tasks, p))}</textarea></label>
      <div class="channels">
        <a class="chan mail" id="ch-mail" data-act="sent" data-v="Correo">${IC.mail}Correo</a>
        <a class="chan sms" id="ch-sms" data-act="sent" data-v="SMS">${IC.sms}Mensaje</a>
        <a class="chan wa" id="ch-wa" data-act="sent" data-v="WhatsApp" target="_blank" rel="noopener">${IC.wa}WhatsApp</a>
      </div>
      ${missing.length ? `<p class="note">Sin ${missing.join(" ni ")} registrado: elegirás el destinatario en la app. <button type="button" class="linkbtn" data-act="editperson" data-id="${pid}">Agregar datos</button></p>` : ""}
      <div class="actions"><button type="button" class="btn" data-act="copyMsg">Copiar mensaje</button>${fresh ? `<button type="button" class="btn" data-act="close">Ahora no</button>` : ""}</div>
    </div>`);
  panel.dataset.ntasks = ids.join(","); panel.dataset.npid = pid;
  updateLinks();
}
function updateLinks(){
  const p = person(panel.dataset.npid); if (!p) return;
  const body = $("#n-msg").value, subj = $("#n-subject").value, enc = encodeURIComponent;
  const ph = intlPhone(p.phone);
  $("#ch-mail").href = `mailto:${p.email ? enc(p.email).replace(/%40/g,"@") : ""}?subject=${enc(subj)}&body=${enc(body)}`;
  $("#ch-sms").href = `sms:${ph ? "+" + ph : ""}${isIOS ? "&" : "?"}body=${enc(body)}`;
  $("#ch-wa").href = `https://wa.me/${ph}?text=${enc(body)}`;
}

/* ---------- Calendario (.ics) ---------- */
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function icsFor(tasks){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Agenda Integral//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const RR = {daily:"FREQ=DAILY", weekdays:"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", weekly:"FREQ=WEEKLY", biweekly:"FREQ=WEEKLY;INTERVAL=2", monthly:"FREQ=MONTHLY", bimonthly:"FREQ=MONTHLY;INTERVAL=2", yearly:"FREQ=YEARLY"};
  tasks.filter(t => t.due).forEach(t => {
    const d = t.due.replace(/-/g,"");
    L.push("BEGIN:VEVENT", "UID:" + t.id + "@agenda-integral", "DTSTAMP:" + stamp);
    if (t.time){
      const s = parseYMD(t.due); const [h,m] = t.time.split(":"); s.setHours(+h,+m); const e = new Date(s.getTime() + 3600000);
      const f = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
      L.push("DTSTART:" + f(s), "DTEND:" + f(e));
    } else L.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + addDays(t.due,1).replace(/-/g,""));
    L.push("SUMMARY:" + icsEsc(t.title), "DESCRIPTION:" + icsEsc(`${AREAS[t.area].name} · ${t.cat}\nResponsable: ${whoName(t.who)}\nPrioridad: ${PRIO[t.prio].l}${t.notes ? "\n" + t.notes : ""}`), "CATEGORIES:" + icsEsc(AREAS[t.area].name));
    if (RR[t.repeat]) L.push("RRULE:" + RR[t.repeat]);
    if (t.remind !== "-1"){
      let off = +t.remind; if (!t.time) off = off - 540;
      L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(t.title), "TRIGGER:" + (off >= 0 ? "-PT" + off + "M" : "PT" + (-off) + "M"), "END:VALARM");
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
async function download(name, text, type){
  if (IN_ARTIFACT && /\.json$/.test(name)){
    try { const dl = window.claude && await window.claude.use("downloads"); if (dl){ await dl.save({filename:name, data:text}); return; } }
    catch(e){ if (e && e.code === "declined") return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast("No se pudo generar el archivo"); }
}

/* ---------- Recordatorios ---------- */
async function notify(t){
  const body = `${relDue(t).txt} · ${AREAS[t.area].name} · ${whoName(t.who)}`;
  try {
    if ("Notification" in window && Notification.permission === "granted"){
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) reg.showNotification(t.title, {body, tag:t.id, icon:"icons/icon-192.png"});
      else new Notification(t.title, {body});
    }
  } catch(e){}
  toast("Recordatorio: " + t.title, 6000);
}
function checkReminders(){
  const now = Date.now(); let changed = false;
  S.tasks.forEach(t => {
    if (t.done || t.remind === "-1" || !t.due) return;
    const key = t.due + "|" + t.time + "|" + t.remind, at = remindTs(t);
    if (t.notified !== key && at <= now && now - at < 12*3600000){ t.notified = key; changed = true; notify(t); }
  });
  if (changed) save();
}

/* ---------- Acciones ---------- */
let toastTimer;
function toast(msg, ms){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms || 2400); }
function confirmIn(zone, msg, label, fn){
  zone.innerHTML = `<p class="note" style="width:100%">${msg}</p><button type="button" class="btn" data-act="cancelDel">Cancelar</button><button type="button" class="btn danger" id="confirmBtn">${label}</button>`;
  $("#confirmBtn").onclick = fn;
}
function toggleTask(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (!t.done && t.repeat !== "none" && t.due){
    S.tasks.push(Object.assign({}, t, {id:uid(), done:true, doneAt:Date.now(), repeat:"none", remind:"-1"}));
    let n = nextDue(t); while (n && n < today()) { t.due = n; n = nextDue(t); }
    t.due = n || t.due; t.notified = "";
    toast("Hecha. Próxima: " + fmtShort(t.due));
  } else {
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    if (t.done) toast("Actividad completada");
  }
  save();
  if (!sheet.hidden && $("#personForm, #taskForm") === null){ const pid = panel.dataset.person, aid = panel.dataset.asset; if (pid) personSheet(pid); else if (aid) assetForm(S.assets.find(a => a.id === aid)); }
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-tab]"); if (!el) return;
  if (el.dataset.tab){ S.ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0); return; }
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (act){
    case "close": closeSheet(); break;
    case "tab": S.ui.tab = v; save(); render(); window.scrollTo(0,0); break;
    case "seg": {
      const n = el.dataset.name;
      if (n === "formArea"){ const f = $("#taskForm"); f.dataset.area = v; el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el)); fillTaskSelects("", $("#f-who").value, ""); }
      else if (n === "formPrio"){ $("#taskForm").dataset.prio = v; el.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el)); }
      else { S.ui[n] = v; if (n === "area") S.ui.cat = ""; save(); render(); }
      break;
    }
    case "cat": S.ui.cat = v; render(); break;
    case "day": S.ui.day = v; render(); break;
    case "showDone": S.ui.showDone = true; render(); break;
    case "toggle": toggleTask(id); break;
    case "edit": panel.dataset.person = ""; panel.dataset.asset = ""; taskForm(S.tasks.find(t => t.id === id)); break;
    case "newtask": {
      const preset = {};
      if (v) preset.due = v;
      if (el.dataset.asset){ const a = S.assets.find(x => x.id === el.dataset.asset); Object.assign(preset, {area:"personal", cat:a.kind === "vehiculo" ? "Vehículos" : "Casas", assetId:a.id}); }
      else if (S.ui.tab === "areas" && S.ui.cat) preset.cat = S.ui.cat;
      panel.dataset.person = ""; panel.dataset.asset = "";
      taskForm(null, preset); setTimeout(() => $("#f-title")?.focus(), 250); break;
    }
    case "assign": panel.dataset.person = ""; taskForm(null, {area:v, who:id}); break;
    case "person": personSheet(id); panel.dataset.person = id; break;
    case "editperson": personForm(person(id)); break;
    case "newperson": personForm(null, v); break;
    case "asset": { const a = S.assets.find(x => x.id === id); assetForm(a); panel.dataset.asset = id; break; }
    case "newasset": assetForm(null, v); break;
    case "settings": settingsSheet(); break;
    case "notify": { const t = S.tasks.find(x => x.id === id); if (t && person(t.who)) notifySheet([t.id], t.who); else toast("Esta actividad no tiene responsable del equipo"); break; }
    case "notifyPerson": { const ids = S.tasks.filter(t => t.who === id && !t.done).sort(sortTasks).map(t => t.id); notifySheet(ids, id); break; }
    case "sent": {
      const at = Date.now();
      (panel.dataset.ntasks || "").split(",").forEach(tid => { const t = S.tasks.find(x => x.id === tid); if (t) t.lastNotice = {ch:v, at}; });
      save(); render(); toast(`Se abrió ${v === "Correo" ? "el correo" : v === "SMS" ? "Mensajes" : "WhatsApp"}. Envíalo desde ahí.`, 3500);
      break;
    }
    case "copyMsg": {
      const ta = $("#n-msg"), txt = ta.value;
      const fallback = () => { ta.focus(); ta.select(); toast("Selecciona y copia el texto"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Mensaje copiado"), fallback); } catch(err){ fallback(); }
      break;
    }
    case "cancelDel": closeSheet(); break;
    case "askDel": confirmIn($("#delZone"), "¿Eliminar esta actividad? No se puede deshacer.", "Eliminar", () => { const fid = $("#taskForm").dataset.id; S.tasks = S.tasks.filter(t => t.id !== fid); save(); closeSheet(); render(); toast("Actividad eliminada"); }); break;
    case "askDelPerson": confirmIn($("#delZone"), "Sus actividades pendientes pasarán a ti.", "Dar de baja", () => { const pid = $("#personForm").dataset.id; S.tasks.forEach(t => { if (t.who === pid) t.who = "me"; }); S.people = S.people.filter(p => p.id !== pid); save(); closeSheet(); render(); toast("Persona dada de baja"); }); break;
    case "askDelAsset": confirmIn($("#delZone"), "Las actividades se conservan sin vínculo.", "Eliminar", () => { const aid = $("#assetForm").dataset.id; S.tasks.forEach(t => { if (t.assetId === aid) t.assetId = ""; }); S.assets = S.assets.filter(a => a.id !== aid); save(); closeSheet(); render(); }); break;
    case "askReset": confirmIn($("#delZone"), "Se borrará todo lo capturado en este dispositivo.", "Borrar todo", () => { S = {v:1, people:[], assets:[], tasks:[], profile:S.profile, ui:Object.assign({}, S.ui, {tab:"hoy"})}; save(); closeSheet(); render(); toast("Listo, empieza desde cero"); }); break;
    case "clearExamples": S.tasks = S.tasks.filter(t => !t.example); S.assets = S.assets.filter(a => !a.example); { const ids = new Set(S.people.filter(p => p.example && !S.tasks.some(t => t.who === p.id)).map(p => p.id)); S.people = S.people.filter(p => !ids.has(p.id)); } save(); render(); toast("Ejemplos borrados"); break;
    case "ics": { const t = S.tasks.find(x => x.id === id); if (!t.due){ toast("Ponle fecha para enviarla al Calendario"); break; } download(t.title.slice(0,40).replace(/[^\wáéíóúñ ]+/gi,"") + ".ics", icsFor([t]), "text/calendar"); break; }
    case "icsAll": { const list = S.tasks.filter(t => !t.done && t.due); if (!list.length){ toast("No hay pendientes con fecha"); break; } download("agenda-pendientes.ics", icsFor(list), "text/calendar"); break; }
    case "notif": if ("Notification" in window) Notification.requestPermission().then(() => settingsSheet()); break;
    case "export": download(`respaldo-agenda-${today()}.json`, JSON.stringify(S, null, 1), "application/json"); break;
    case "import": $("#importFile").click(); break;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "taskForm") saveTask(e.target);
  else if (e.target.id === "personForm") savePerson(e.target);
  else if (e.target.id === "assetForm") saveAsset(e.target);
  else if (e.target.id === "profileForm"){ Object.assign(S.profile, {name:$("#pr-name").value.trim(), inbursaTitle:$("#pr-inb").value.trim(), tlgTitle:$("#pr-tlg").value.trim()}); save(); toast("Firma guardada"); }
});
document.addEventListener("input", e => { if (e.target.id === "n-msg" || e.target.id === "n-subject") updateLinks(); });
document.addEventListener("change", e => { if (e.target.id === "f-cat") syncAsset(""); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.tasks) || !Array.isArray(d.people)) throw 0; S = d; S.assets = S.assets || []; S.profile = Object.assign({name:"", inbursaTitle:"Gerente de Relaciones Institucionales", tlgTitle:"Director General"}, S.profile||{}); S.ui = Object.assign({}, S.ui, {tab:"hoy"}); save(); closeSheet(); render(); toast("Respaldo importado"); } catch(err){ toast("El archivo no es un respaldo válido"); } };
  r.readAsText(f); e.target.value = "";
});

async function boot(){
  const local = readLocal() || await idbGet();
  const remote = await cloudLoad();
  S = remote && (!local || (remote.savedAt || 0) >= (local.savedAt || 0)) ? remote : (local || seed());
  normalize();
  writeLocal();
  if (cloudRef && S !== remote) pushCloud();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  $("#loading").hidden = true;
  render();
  checkReminders();
  setInterval(checkReminders, 30000);
  setInterval(() => { if (sheet.hidden) render(); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ if (cloudTimer) pushCloud(); }
    else { checkReminders(); if (sheet.hidden) render(); }
  });
  window.addEventListener("pagehide", () => { if (cloudTimer) pushCloud(); });
}
boot();
try { if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js"); } catch(e){}
})();
</script>
